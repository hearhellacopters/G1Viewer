<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>G1 Viewer</title>

  <style>
    :root { --bg: #15171a; --panel: #1e2126; --panel2: #262a30; --border: #33383f; --fg: #d7dae0; --muted: #8a919c; --accent: #4f9cf7; --accent2: #f7a24f; --danger: #f75f4f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    #app { position: relative; display: grid; grid-template-rows: 40px 1fr; grid-template-columns: var(--left-w, 290px) 1fr var(--right-w, 360px); height: 100vh; }
    #left-resize, #right-resize { position: absolute; top: 40px; bottom: 0; width: 6px; cursor: col-resize; z-index: 8; }
    #left-resize { left: calc(var(--left-w, 290px) - 3px); }
    #right-resize { right: calc(var(--right-w, 360px) - 3px); }

    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing #center { pointer-events: none; }
    header { grid-column: 1 / -1; max-width: 100vw; min-width: 0; box-sizing: border-box; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--border); }
    header .brand { display: flex; align-items: center; padding: 3px; margin-right: 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; }
    header .brand:hover { border-color: var(--accent); }
    header .brand svg { display: block; }
    header .version { font-size: 11px; color: var(--muted); margin-left: 8px; padding: 2px 4px; border-radius: 3px; }
    header .about-link { cursor: pointer; }
    header .about-link:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    #menus { display: flex; align-items: center; gap: 2px; }
    #menus details.menu > summary { background: transparent; border-color: transparent; padding: 5px 10px; }
    #menus details.menu > summary:hover, #menus details.menu[open] > summary { background: var(--panel2); border-color: var(--border); }
    #menus details.menu > .menu-body { top: calc(100% + 6px); max-height: calc(100vh - 64px); min-width: 230px; z-index: 30; }
    details.menu button.menu-item { text-align: left; background: transparent; border-color: transparent; padding: 3px 6px; white-space: nowrap; }
    details.menu button.menu-item:hover { background: var(--panel2); border-color: transparent; color: var(--accent); }
    details.menu .menu-note { color: var(--muted); font-size: 11px; padding: 0 6px 2px; white-space: normal; max-width: 260px; }

    .about-tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
    .md-table { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: 12px; }

    .md-table th { color: var(--muted); font-weight: 500; }

    .seg button { border: 0; border-radius: 0; padding: 3px 12px; }

    .seg button:disabled { opacity: .35; }
    .paramlist .slider-row { display: flex; align-items: center; gap: 6px; padding: 1px 2px; white-space: nowrap; color: var(--muted); }

    .paramlist .slider-row.off, .paramlist label.toggle.off { opacity: .45; }

    .about-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; width: min(720px, 100%); max-height: calc(100vh - 80px); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
    .about-head { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }

    .md li { margin: 3px 0; }

    .md a { color: var(--accent); }
    header .spacer { flex: 1; }
    header .status { color: var(--muted); font-size: 12px; max-width: 50vw; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    header .status.error { color: var(--danger); font-weight: 600; }
    header .status-errors { flex: none; margin-right: 6px; padding: 1px 7px; font-size: 11px; font-weight: 600; color: #fff; background: var(--danger); border-color: var(--danger); border-radius: 10px; }
    header .status-errors[hidden] { display: none; }

    .status-panel .row .grow { flex: 1; }
    .status-panel .row button { font-size: 11px; padding: 1px 6px; }
    .status-panel .now, .status-panel .err-item { white-space: pre-wrap; word-break: break-word; user-select: text; }

    header .progress { flex: none; width: 90px; height: 4px; margin-right: 8px; border-radius: 2px; background: var(--line, #2c3038); overflow: hidden; position: relative; }
    header .progress[hidden] { display: none; }
    header .progress > span { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: #4f9cf7; transition: width 0.2s; }
    header .progress.sweep > span { width: 30%; animation: g1-sweep 1.1s ease-in-out infinite; transition: none; }
    @keyframes g1-sweep { from { left: -30%; } to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { header .progress.sweep > span { animation: none; left: 0; width: 100%; opacity: 0.5; } }
    button, select, input[type=number], input[type=text] { background: var(--panel2); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font: inherit; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    label.toggle { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; user-select: none; }
    #left, #right { background: var(--panel); overflow: auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    #right { border-right: 0; border-left: 1px solid var(--border); position: relative; }
    .audiobar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column; gap: 5px;
      background: rgba(20, 22, 26, .94); padding: 6px 10px; border-top: 1px solid var(--border); backdrop-filter: blur(4px); }
    .audiobar .bar-row { display: flex; gap: 8px; align-items: center; min-width: 0; }

    #camreadout.on { display: flex; }

    .overlay { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: rgba(20, 22, 26, .75); padding: 6px 8px; border-radius: 6px; backdrop-filter: blur(4px); }
    #animbar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 5px;

    #animbar[hidden] { display: none; }
    .knob { position: relative; flex: none; width: 26px; height: 26px; outline: none; cursor: ns-resize; touch-action: none; }
    .knob-dial { position: absolute; inset: 1px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #353a42, var(--panel2) 70%);
      border: 1px solid var(--border); box-shadow: inset 0 -2px 3px rgba(0,0,0,.35); }
    .knob-pointer { position: absolute; left: 50%; top: 2px; bottom: 50%; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--accent); transform-origin: 50% 100%; }
    .knob:hover .knob-dial, .knob:focus-visible .knob-dial, .knob.turning .knob-dial { border-color: var(--accent); }
    .knob.off { opacity: .4; cursor: default; }
    .knob.off .knob-pointer { background: var(--muted); }
    .knob-pop { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center;
      padding: 3px 7px; border-radius: 4px; background: rgba(12, 14, 17, .96); border: 1px solid var(--border); white-space: nowrap; font-size: 11px; z-index: 30; pointer-events: none; }
    .knob-pop b { font-variant-numeric: tabular-nums; color: var(--fg); }
    .knob-pop span { color: var(--muted); }
    .knob:not(.off):focus-visible .knob-pop, .knob.turning .knob-pop, .knob.shown .knob-pop { display: flex; }
    @media (hover: hover) { .knob:not(.off):hover .knob-pop { display: flex; } }
    @media (pointer: coarse) { .knob::before { content: ''; position: absolute; inset: -9px; } }
    #animbar .bar-row { display: flex; gap: 8px; align-items: center; min-width: 0; }
    #animbar .bar-row > * { min-width: 0; flex-shrink: 1; }
    #animbar select { flex: 1 1 0; min-width: 60px; text-overflow: ellipsis; }
    #animbar button { flex: none; }

    #animbar input[type=number] { flex: none; width: 56px; }
    #animbar .knob { flex: none; }
    #animbar .transport > button { flex: none; width: 30px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }

    details.menu { position: relative; }
    details.menu > summary { list-style: none; cursor: pointer; user-select: none;

    details.menu > summary::-webkit-details-marker { display: none; }
    details.menu > summary:hover { border-color: var(--accent); }
    details.menu[open] > summary { border-color: var(--accent); }
    details.menu > .menu-body { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 190px;
      max-height: min(60vh, 420px); overflow-y: auto;

      background: rgba(20, 22, 26, .97); backdrop-filter: blur(4px); box-shadow: 0 6px 18px rgba(0,0,0,.45); }
    details.menu .menu-head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px;

    .paramlist .menu-head:first-child { border-top: 0; margin-top: 0; }
