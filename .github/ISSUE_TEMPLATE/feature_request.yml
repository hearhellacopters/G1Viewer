name: Feature request
description: Something you would like the viewer to do.
title: "[Request] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it is for
      description: What you are trying to do with it - it helps pick the right way to build it.
  - type: input
    id: games
    attributes:
      label: Games it would help with
